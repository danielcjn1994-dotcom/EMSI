<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMSI English - 英语语法专项练习</title>
    <style>
        /* 基础样式 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background-color: #f0f4f8; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- 页眉设计 --- */
        .header {
            background-color: white;
            text-align: center;
            padding: 50px 20px 30px 20px;
            border-bottom: 5px solid #3498db;
            position: relative;
        }

        /* 返回 index.html 的主页按钮 */
        .btn-home {
            position: absolute;
            left: 20px;
            top: 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #1a4a8e;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 20px;
            background: #e1f5fe;
            border: 1px solid #b3e5fc;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: #3498db;
            color: white;
            border-color: #3498db;
            transform: translateX(-3px);
        }

        .btn-home svg {
            margin-right: 6px;
        }

        .header h1 {
            color: #1a4a8e;
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 800;
            margin: 0;
        }

        .header h1 span { color: #3498db; }

        .header .subtitle {
            color: #6b7280;
            font-size: 18px;
            margin-top: 10px;
        }

        /* --- 网格布局 --- */
        .main-content {
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .grade-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid #e1e8ed;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .grade-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(52, 152, 219, 0.2);
            border-color: #3498db;
        }

        .grade-card h2 { color: #1a4a8e; margin: 0 0 10px 0; font-size: 26px; }
        .grade-card p { color: #7f8c8d; margin: 0; }

        .grade-card .btn-go {
            margin-top: 15px;
            display: inline-block;
            padding: 8px 18px;
            background-color: #3498db;
            color: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        /* --- 页脚 --- */
        .footer {
            background-color: #1a4a8e;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .header { padding-top: 70px; }
            .btn-home { top: 15px; left: 50%; transform: translateX(-50%); }
            .btn-home:hover { transform: translateX(-50%) translateY(-2px); }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="btn-home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            返回主页
        </a>
        
        <h1><span>EMSI</span> English Grammar</h1>
        <div class="subtitle">英语语法专项练习 (Grade 1 - 6)</div>
    </header>

    <main class="main-content">
        <a href="english-grammar 1.html" class="grade-card">
            <h2>Grade 1</h2>
            <p>一年级语法复习</p>
            <div class="btn-go">START</div>
        </a>

        <a href="english-grammar 2.html" class="grade-card">
            <h2>Grade 2</h2>
            <p>二年级语法复习</p>
            <div class="btn-go">START</div>
        </a>

        <a href="english-grammar 3.html" class="grade-card">
            <h2>Grade 3</h2>
            <p>三年级语法复习</p>
            <div class="btn-go">START</div>
        </a>

        <a href="english-grammar 4.html" class="grade-card">
            <h2>Grade 4</h2>
            <p>四年级语法复习</p>
            <div class="btn-go">START</div>
        </a>

        <a href="english-grammar 5.html" class="grade-card">
            <h2>Grade 6</h2>
            <p>五年级语法复习</p>
            <div class="btn-go">START</div>
        </a>

        <a href="english-garmmar 6.html" class="grade-card">
            <h2>Grade 6</h2>
            <p>六年级语法复习</p>
            <div class="btn-go">START</div>
        </a>
    </main>

    <footer class="footer">
        © 2026 EMSI 马德里国际中文学校 | Educación para un futuro mejor
    </footer>

</body>
</html>
