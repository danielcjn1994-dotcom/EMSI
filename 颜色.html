<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMSI 西语词汇挑战系统 - 颜色篇</title>
    <style>
        :root {
            --emsi-blue: #1a4a8e;
            --emsi-gold: #f1c40f;
            --emsi-gray: #f5f7fa;
            --success: #10b981;
            --error: #ef4444;
            --text-main: #1e293b;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background-color: var(--emsi-gray);
            color: var(--text-main);
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* --- Header --- */
        .header { background-color: white; text-align: center; padding: 25px 10px; border-bottom: 5px solid var(--emsi-gold); }
        .header h1 { color: var(--emsi-blue); margin: 0; font-size: 32px; font-weight: 800; }

        .main-content { flex: 1; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

        /* --- 导航按钮 --- */
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        
        .btn-back {
            display: inline-flex; align-items: center; padding: 10px 25px; background-color: white;
            border: 2px solid #e2e8f0; border-radius: 50px; color: var(--emsi-blue);
            text-decoration: none; font-size: 16px; font-weight: 700; transition: all 0.2s;
        }
        .btn-back:hover { border-color: var(--emsi-blue); background-color: #f8fafc; transform: translateX(-3px); }
        .btn-back::before { content: '〈'; margin-right: 8px; font-weight: bold; }

        .btn {
            padding: 12px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: 0.2s; border: none; display: flex; align-items: center; gap: 8px;
        }
        .btn-home { border: 2px solid var(--emsi-blue); color: var(--emsi-blue); background: white; }
        .btn-home:hover { background: var(--emsi-blue); color: white; }
        .btn-gold { background: var(--emsi-gold); color: #1e293b; }
        .btn-blue { background: var(--emsi-blue); color: white; }

        .screen { display: none; }
        .active { display: block; }

        /* --- 单词展示表样式 (放大适配投屏) --- */
        .word-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
        .word-item { 
            display: flex; align-items: center; padding: 15px 20px; background: #fff; 
            border-radius: 16px; border: 2px solid #eef2f7; transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .word-item:hover { transform: translateY(-3px); border-color: #cbd5e1; box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
        .word-emoji { font-size: 3rem; margin-right: 20px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); }
        
        .word-text-box { display: flex; flex-direction: column; gap: 5px; }
        .word-es { font-weight: 800; color: var(--emsi-blue); font-size: 1.8rem; border-radius: 8px; padding: 2px 8px; margin-left: -8px; transition: 0.2s;}
        .word-cn { color: #64748b; font-size: 1.3rem; font-weight: 600; }

        .dictation-mode .word-es { color: transparent; background: #dbeafe; cursor: pointer; user-select: none; }
        .dictation-mode .word-es.show { color: var(--emsi-blue); background: transparent; }

        /* --- 练习系统样式 --- */
        .progress-bar { width: 100%; height: 12px; background: #f1f5f9; border-radius: 10px; overflow: hidden; margin: 25px 0; }
        #progress-fill { height: 100%; background: var(--emsi-blue); width: 0%; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #quiz-prompt { text-align: center; color: #64748b; font-size: 1.2rem; font-weight: 600; margin-bottom: 10px;}
        .word-display { text-align: center; font-size: 3.5rem; font-weight: 800; color: var(--emsi-blue); margin: 30px 0; letter-spacing: 2px;}
        
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px;}
        .option-btn {
            padding: 25px 20px; border: 3px solid #f1f5f9; border-radius: 16px;
            background: white; font-size: 1.5rem; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center;
        }
        .option-btn:hover { border-color: var(--emsi-blue); background: #f8fafc; transform: scale(1.02); }
        .correct { background: var(--success) !important; color: white; border-color: var(--success) !important; }
        .wrong { background: var(--error) !important; color: white; border-color: var(--error) !important; }

        /* --- 拼写挑战样式 --- */
        .spell-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 35px; flex-wrap: wrap; }
        .letter-box {
            width: 55px; height: 70px; border: 3px solid #e2e8f0; border-radius: 12px; background: white;
            display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 800; color: var(--emsi-blue);
        }
        .letter-box.blank { border-color: #cbd5e1; background: #f8fafc; cursor: pointer; color: transparent; }
        .letter-box.active-blank { border-color: var(--emsi-gold); background: #fffdf5; box-shadow: 0 0 0 4px rgba(241, 196, 15, 0.2); }
        
        /* 西语键盘适配 */
        .keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 800px; margin: 0 auto; }
        .key-btn { 
            padding: 15px 20px; border: none; background: #e2e8f0; border-radius: 10px; 
            font-weight: 700; font-size: 1.4rem; color: #334155; cursor: pointer; transition: 0.1s; min-width: 50px;
        }
        .key-btn:hover { background: #cbd5e1; transform: translateY(-2px); }
        .key-btn:active { transform: translateY(0); background: #94a3b8; color: white;}

        .footer { background: var(--emsi-blue); color: white; text-align: center; padding: 20px; font-size: 15px; margin-top: auto; }

        @media (max-width: 600px) { 
            .header h1 { font-size: 24px; }
            .word-item { flex-direction: column; text-align: center; }
            .word-emoji { margin-right: 0; margin-bottom: 10px; }
            .word-es { margin-left: 0; }
            .key-btn { padding: 12px 15px; font-size: 1.2rem; min-width: 40px;}
            .letter-box { width: 45px; height: 55px; font-size: 1.8rem; }
            .option-btn { font-size: 1.3rem; padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>EMSI 西语颜色词汇大挑战</h1>
        <div style="color: #6b7280; font-size: 16px; margin-top: 8px; font-weight: 500;">Colegio Chino Internacional de Madrid</div>
    </header>

    <main class="main-content">
        <div class="card">
            
            <div id="menu-screen" class="screen active">
                <div class="nav-bar">
                    <a href="color.html" class="btn-back">返回</a>
                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <button class="btn btn-home" onclick="toggleDictation()" id="dictBtn">✍️ 隐藏西语(听写)</button>
                        <button class="btn btn-gold" onclick="downloadCSV()">📥 下载词汇表</button>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap;">
                    <button class="btn btn-blue" style="flex:1; justify-content:center; padding: 18px; font-size: 1.2rem;" onclick="startQuiz('es-cn')">🇪🇸 西译汉练习</button>
                    <button class="btn btn-blue" style="flex:1; justify-content:center; padding: 18px; font-size: 1.2rem;" onclick="startQuiz('cn-es')">🇨🇳 汉译西练习</button>
                    <button class="btn btn-gold" style="flex:1; justify-content:center; padding: 18px; font-size: 1.2rem;" onclick="startQuiz('fill')">⌨️ 单词拼写</button>
                </div>

                <h2 style="border-left: 6px solid var(--emsi-gold); padding-left: 15px; color: var(--text-main);">🎨 核心词汇 (Los Colores)</h2>
                <div class="word-grid" id="mainWordTable"></div>
            </div>

            <div id="quiz-screen" class="screen">
                <div class="nav-bar">
                    <button class="btn btn-home" onclick="location.reload()">⬅ 退出练习</button>
                    <span id="quiz-counter" style="font-size: 1.4rem; font-weight:800; color: var(--emsi-blue);">1 / 10</span>
                    <button class="btn btn-gold" onclick="showResults()">提前交卷</button>
                </div>
                <div class="progress-bar"><div id="progress-fill"></div></div>
                <div id="quiz-prompt"></div>
                <div id="quiz-display" class="word-display"></div>
                <div id="spell-area" class="spell-container"></div>
                <div id="mcq-area" class="options-grid"></div>
                <div id="keyboard-area" class="keyboard"></div>
                
                <div style="display: flex; justify-content: space-between; margin-top: 40px; border-top: 2px solid #f1f5f9; padding-top: 25px;">
                    <button class="btn btn-home" id="prev-btn" onclick="changeStep(-1)">上一题</button>
                    <button class="btn btn-blue" id="next-btn" onclick="changeStep(1)">下一题</button>
                </div>
            </div>

            <div id="result-screen" class="screen">
                <h1 style="text-align: center; color: var(--emsi-blue); font-size: 2.5rem;">练习结果报告</h1>
                <div id="final-score" style="text-align: center; font-size: 6rem; font-weight: 900; color: var(--emsi-gold); text-shadow: 2px 2px 0px #eab308;">0%</div>
                <div id="result-summary" style="text-align: center; font-size: 1.5rem; font-weight: 600; color: #475569; margin-bottom: 40px;"></div>
                
                <div style="display: flex; gap: 15px; max-width: 400px; margin: 0 auto; flex-direction: column;">
                    <button class="btn btn-blue" style="justify-content:center; padding: 18px; font-size: 1.2rem;" onclick="location.reload()">🔄 再次挑战</button>
                </div>
            </div>

        </div>
    </main>

    <footer class="footer">
        © 2026 EMSI 马德里国际中文学校 | Educación para un futuro mejor
    </footer>

    <script>
        // 西语颜色词汇库
        const dictionary = [
            {es: "azul", cn: "蓝色", emoji: "🟦"},
            {es: "rojo", cn: "红色", emoji: "🟥"},
            {es: "verde", cn: "绿色", emoji: "🟩"},
            {es: "amarillo", cn: "黄色", emoji: "🟨"},
            {es: "naranja", cn: "橙色", emoji: "🟧"},
            {es: "rosa", cn: "粉色", emoji: "🩷"},
            {es: "gris", cn: "灰色", emoji: "🩶"},
            {es: "marrón", cn: "棕色", emoji: "🟫"},
            {es: "negro", cn: "黑色", emoji: "⬛"},
            {es: "blanco", cn: "白色", emoji: "⬜"},
            {es: "morado", cn: "紫色", emoji: "🟪"},
            {es: "violeta", cn: "紫罗兰色", emoji: "🟣"}
        ];

        let currentMode = '', quizList = [], currentIndex = 0, userAnswers = {};

        function initMainTable() {
            const container = document.getElementById('mainWordTable');
            container.innerHTML = dictionary.map((item, i) => `
                <div class="word-item">
                    <span class="word-emoji">${item.emoji}</span>
                    <div class="word-text-box">
                        <span class="word-es" onclick="this.classList.toggle('show')">${item.es}</span>
                        <span class="word-cn">${item.cn}</span>
                    </div>
                </div>
            `).join('');
        }

        function toggleDictation() {
            const grid = document.getElementById('mainWordTable');
            const btn = document.getElementById('dictBtn');
            grid.classList.toggle('dictation-mode');
            btn.innerText = grid.classList.contains('dictation-mode') ? "👀 显示西语" : "✍️ 隐藏西语(听写)";
        }

        function startQuiz(mode) {
            currentMode = mode;
            quizList = [...dictionary].sort(() => Math.random() - 0.5).map(item => ({
                ...item, gaps: makeGaps(item.es)
            }));
            currentIndex = 0;
            userAnswers = {};
            if(mode === 'fill') initKeyboard();
            showScreen('quiz-screen');
            renderQuestion();
        }

        function makeGaps(word) {
            let indices = [];
            // 去除空格影响
            const cleanWordLength = word.replace(/\s/g, '').length;
            let gapCount = Math.max(1, Math.floor(cleanWordLength * 0.4));
            while(indices.length < gapCount) {
                let r = Math.floor(Math.random() * word.length);
                if(!indices.includes(r) && word[r] !== ' ') indices.push(r);
            }
            return indices;
        }

        function renderQuestion() {
            const item = quizList[currentIndex];
            const display = document.getElementById('quiz-display');
            const spellArea = document.getElementById('spell-area');
            const mcqArea = document.getElementById('mcq-area');
            const kbArea = document.getElementById('keyboard-area');
            
            document.getElementById('quiz-counter').innerText = `${currentIndex + 1} / ${quizList.length}`;
            document.getElementById('progress-fill').style.width = ((currentIndex + 1) / quizList.length * 100) + '%';
            document.getElementById('prev-btn').disabled = currentIndex === 0;

            spellArea.style.display = 'none'; mcqArea.style.display = 'none'; kbArea.style.display = 'none';
            display.style.display = 'block';

            if (currentMode === 'fill') {
                display.style.display = 'none';
                spellArea.style.display = 'flex'; kbArea.style.display = 'flex';
                document.getElementById('quiz-prompt').innerText = `根据中文及图标补全单词：${item.emoji} ${item.cn}`;
                renderSpellBoxes(item);
            } else {
                mcqArea.style.display = 'grid';
                document.getElementById('quiz-prompt').innerText = currentMode === 'es-cn' ? '请选择正确的中文翻译' : '请选择正确的西语单词';
                display.innerText = currentMode === 'es-cn' ? item.es : `${item.emoji} ${item.cn}`;
                renderMCQ(item);
            }
        }

        function renderMCQ(item) {
            const mcqArea = document.getElementById('mcq-area');
            mcqArea.innerHTML = '';
            
            const correct = currentMode === 'es-cn' ? `${item.emoji} ${item.cn}` : item.es;
            
            if (!item.options) {
                let distractors = dictionary.map(d => currentMode === 'es-cn' ? `${d.emoji} ${d.cn}` : d.es)
                    .filter(v => v !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
                item.options = [correct, ...distractors].sort(() => Math.random() - 0.5);
            }
            item.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                if (userAnswers[currentIndex] === opt) btn.classList.add(opt === correct ? 'correct' : 'wrong');
                btn.onclick = () => {
                    if (userAnswers[currentIndex]) return; // 防止重复点击
                    userAnswers[currentIndex] = opt;
                    renderQuestion();
                    if(opt === correct) setTimeout(() => changeStep(1), 600);
                };
                mcqArea.appendChild(btn);
            });
        }

        function renderSpellBoxes(item) {
            const spellArea = document.getElementById('spell-area');
            spellArea.innerHTML = '';
            if (!userAnswers[currentIndex]) {
                userAnswers[currentIndex] = item.es.split('').map((char, i) => item.gaps.includes(i) ? '' : char);
            }
            userAnswers[currentIndex].forEach((char, i) => {
                const box = document.createElement('div');
                
                // 处理单词间的空格（保留逻辑以防将来增加如 "azul claro"）
                if (item.es[i] === ' ') {
                    box.style.width = '20px';
                    box.style.border = 'none';
                    box.style.background = 'transparent';
                } else {
                    box.className = 'letter-box' + (item.gaps.includes(i) && char === '' ? ' blank' : '');
                    
                    if(item.gaps.includes(i) && char !== '') {
                        box.classList.add('blank');
                        box.style.color = 'var(--emsi-blue)';
                    }
                    
                    box.innerText = char;
                    if (item.gaps.includes(i)) {
                        box.onclick = () => {
                            document.querySelectorAll('.letter-box').forEach(b => b.classList.remove('active-blank'));
                            box.classList.add('active-blank');
                            box.dataset.index = i;
                        };
                    }
                }
                spellArea.appendChild(box);
            });
            const firstBlank = Array.from(spellArea.querySelectorAll('.blank')).find(b => b.innerText === '');
            if (firstBlank) firstBlank.click();
            else {
                // 检查是否拼写正确，全填满后自动核对
                const currentWord = userAnswers[currentIndex].join('');
                if(currentWord.length === item.es.length) {
                    if(currentWord.toLowerCase() === item.es.toLowerCase()) {
                        setTimeout(() => changeStep(1), 600);
                    }
                }
            }
        }

        function initKeyboard() {
            const kb = document.getElementById('keyboard-area');
            kb.innerHTML = '';
            // 包含了西语特殊字符 á, é, í, ó, ú, ñ
            const keys = "abcdefghijklmnopqrstuvwxyzáéíóúñ".split('');
            keys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'key-btn'; btn.innerText = key;
                btn.onclick = () => {
                    const active = document.querySelector('.active-blank');
                    if(!active) return;
                    const idx = active.dataset.index;
                    userAnswers[currentIndex][idx] = key;
                    renderSpellBoxes(quizList[currentIndex]);
                };
                kb.appendChild(btn);
            });
        }

        function changeStep(s) {
            currentIndex += s;
            if(currentIndex >= quizList.length) { showResults(); return; }
            if(currentIndex < 0) currentIndex = 0;
            renderQuestion();
        }

        function showResults() {
            showScreen('result-screen');
            let correct = 0;
            quizList.forEach((item, i) => {
                const ans = userAnswers[i];
                if(currentMode === 'fill') {
                    if(ans && ans.join('').toLowerCase() === item.es.toLowerCase()) correct++;
                } else {
                    const target = currentMode === 'es-cn' ? `${item.emoji} ${item.cn}` : item.es;
                    if(ans === target) correct++;
                }
            });
            const score = Math.round((correct / quizList.length) * 100);
            document.getElementById('final-score').innerText = score + "%";
            document.getElementById('result-summary').innerHTML = `✅ 答对: ${correct} 个 <br> ❌ 错题: ${quizList.length - correct} 个`;
        }

        function downloadCSV() {
            let csv = "\uFEFF序号,西语,中文\n";
            dictionary.forEach((item, i) => csv += `${i+1},${item.es},${item.cn}\n`);
            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "西语颜色词汇表.csv";
            link.click();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        initMainTable();
    </script>
</body>
</html>
