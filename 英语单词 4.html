<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMSI 英语词汇挑战系统</title>
    <style>
        :root {
            --emsi-blue: #1a4a8e;
            --emsi-gold: #f1c40f;
            --emsi-gray: #f5f7fa;
            --success: #10b981;
            --error: #ef4444;
            --text-main: #1e293b;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background-color: var(--emsi-gray);
            color: var(--text-main);
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* --- Header --- */
        .header { background-color: white; text-align: center; padding: 20px 10px; border-bottom: 5px solid var(--emsi-gold); }
        .header h1 { color: var(--emsi-blue); margin: 0; font-size: 28px; }

        .main-content { flex: 1; padding: 20px; max-width: 1100px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

        /* --- 导航按钮 --- */
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .btn-back {
            display: inline-flex; align-items: center; padding: 8px 20px;
            background-color: white; border: 1.5px solid #e2e8f0; border-radius: 50px;
            color: var(--emsi-blue); text-decoration: none; font-size: 15px; font-weight: 600; transition: all 0.2s;
        }
        .btn-back:hover { border-color: var(--emsi-blue); background-color: #f8fafc; transform: translateX(-3px); }
        .btn-back::before { content: '〈'; margin-right: 5px; font-weight: bold; }

        .btn {
            padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px;
            cursor: pointer; transition: 0.2s; border: none; display: flex; align-items: center; gap: 8px; justify-content: center;
        }
        .btn-home { border: 2px solid var(--emsi-blue); color: var(--emsi-blue); background: white; }
        .btn-home:hover { background: var(--emsi-blue); color: white; }
        .btn-gold { background: var(--emsi-gold); color: #1e293b; }
        .btn-blue { background: var(--emsi-blue); color: white; }

        .screen { display: none; }
        .active { display: block; }

        /* --- 单元折叠面板 (Accordion) --- */
        .unit-card { 
            margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 12px; 
            background: white; overflow: hidden; transition: 0.3s;
        }
        .unit-header {
            padding: 18px 20px; background: #f8fafc; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; color: var(--emsi-blue);
            transition: 0.2s;
        }
        .unit-header:hover { background: #f0f4f8; }
        .unit-header::after { content: '▼'; font-size: 0.9rem; transition: transform 0.3s; color: #94a3b8; }
        .unit-card.active .unit-header { border-bottom: 2px solid #e2e8f0; }
        .unit-card.active .unit-header::after { transform: rotate(180deg); color: var(--emsi-blue); }
        
        .unit-body { display: none; padding: 20px; }
        .unit-card.active .unit-body { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .unit-actions { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;
            padding-bottom: 20px; border-bottom: 1px dashed #cbd5e1;
        }

        /* --- 单词展示表样式 --- */
        .word-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .word-item { 
            display: flex; align-items: center; padding: 10px; background: #fff; 
            border-radius: 8px; border: 1px solid #eef2f7; transition: 0.2s;
        }
        .word-item:hover { border-color: var(--emsi-blue); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .word-num { color: #94a3b8; font-weight: bold; margin-right: 10px; min-width: 25px; }
        .word-emoji { font-size: 1.2rem; margin-right: 5px; }
        .word-en { font-weight: 700; color: var(--emsi-blue); margin-right: 10px; border-radius: 4px; padding: 0 4px; }
        .word-cn { color: #475569; font-size: 14px; }

        .dictation-mode .word-en { color: transparent; background: #dbeafe; cursor: pointer; user-select: none; }
        .dictation-mode .word-en.show { color: var(--emsi-blue); background: transparent; }

        /* --- 练习系统样式 --- */
        .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 10px; overflow: hidden; margin: 20px 0; }
        #progress-fill { height: 100%; background: var(--emsi-blue); width: 0%; transition: 0.3s; }
        .word-display { text-align: center; font-size: 2.5rem; font-weight: 800; color: var(--emsi-blue); margin: 30px 0; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn {
            padding: 18px; border: 2px solid #f1f5f9; border-radius: 12px;
            background: white; font-size: 1.1rem; cursor: pointer; transition: 0.2s; text-align: left;
        }
        .option-btn:hover { border-color: var(--emsi-blue); background: #f0f7ff; }
        .correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .wrong { background: var(--error) !important; color: white; border-color: var(--error); }

        .spell-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .letter-box {
            width: 40px; height: 50px; border: 2px solid #e2e8f0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; text-transform: lowercase;
        }
        .letter-box.blank { border-color: var(--emsi-blue); background: #f0f4ff; cursor: pointer; }
        .letter-box.active-blank { border-color: var(--emsi-gold); box-shadow: 0 0 8px rgba(241, 196, 15, 0.5); }
        .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 500px; margin: 0 auto; }
        .key-btn { padding: 12px 0; border: none; background: #e2e8f0; border-radius: 6px; font-weight: 600; cursor: pointer; text-transform: lowercase;}
        .key-btn:hover { background: #cbd5e1; }

        /* 响应式调整 */
        @media (max-width: 900px) { 
            .word-grid { grid-template-columns: repeat(2, 1fr); } 
            .unit-actions { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) { 
            .word-grid { grid-template-columns: 1fr; } 
            .unit-actions { grid-template-columns: 1fr; }
            .keyboard { grid-template-columns: repeat(6, 1fr); } 
        }

        .footer { background: var(--emsi-blue); color: white; text-align: center; padding: 15px; font-size: 14px; margin-top: auto; }
    </style>
</head>
<body>

    <header class="header">
        <h1>EMSI 英语词汇综合学习系统</h1>

                </div>

                <div id="spell-area" class="spell-container"></div>
                <div id="mcq-area" class="options-grid"></div>
                <div id="keyboard-area" class="keyboard"></div>
                
                <div style="display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                    <button class="btn btn-home" id="prev-btn" onclick="changeStep(-1)">上一题</button>
                    <button class="btn btn-blue" id="next-btn" onclick="changeStep(1)">下一题</button>
                </div>
            </div>

            <div id="result-screen" class="screen">

                <div id="final-score" style="text-align: center; font-size: 4rem; font-weight: 800; color: var(--emsi-gold);">0%</div>
                <div id="result-summary" style="text-align: center; line-height: 2; margin-bottom: 20px; font-size: 1.2rem;"></div>
                <button class="btn btn-blue" style="width:100%; margin-bottom:10px;" onclick="showScreen('menu-screen')">回到单词列表</button>
                <a href="Vocabrarioingles.html" class="btn btn-home">返回 Vocabulario 总览</a>
            </div>

        </div>
    </main>

        let currentMode = '', currentUnitIndex = 0, quizList = [], currentIndex = 0, userAnswers = {};

        // --- 渲染全部单元折叠面板 ---
        function initUnits() {
            const container = document.getElementById('units-container');
            container.innerHTML = vocabularyData.map((unitObj, unitIndex) => `
                <div class="unit-card" id="unit-${unitIndex}">
                    <div class="unit-header" onclick="toggleUnit(${unitIndex})">
                        <span>📖 ${unitObj.unit}</span>
                        <span style="font-size: 0.9rem; font-weight: normal; color: #64748b;">(${unitObj.words.length} 词)</span>
                    </div>
                    <div class="unit-body">
                        <div class="unit-actions">
                            <button class="btn btn-blue" onclick="startQuiz('en-cn', ${unitIndex})">英译汉练习</button>
                            <button class="btn btn-blue" onclick="startQuiz('cn-en', ${unitIndex})">汉译英练习</button>
                            <button class="btn btn-gold" onclick="startQuiz('fill', ${unitIndex})">拼写挑战</button>
                            <button class="btn btn-home" onclick="downloadUnitCSV(${unitIndex})">📥 下载本单元</button>
                        </div>
                        
                        <div class="word-grid">
                            ${unitObj.words.map((w, i) => `
                                <div class="word-item">
                                    <span class="word-num">${i + 1}.</span>
                                    <span class="word-emoji">${w.emoji}</span>
                                    <span class="word-en" onclick="this.classList.toggle('show')">${w.en}</span>
                                    <span class="word-cn">${w.cn}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

        // 展开/收起单个单元
        function toggleUnit(index) {
            const card = document.getElementById(`unit-${index}`);
            card.classList.toggle('active');
        }

        // 切换全网页的听写模式
        function toggleDictation() {
            const wrapper = document.getElementById('units-container');
            const btn = document.getElementById('dictBtn');
            wrapper.classList.toggle('dictation-mode');
            btn.innerText = wrapper.classList.contains('dictation-mode') ? "👀 取消听写" : "✍️ 全局听写模式";
        }

        // --- 启动单元专项练习 ---

            currentUnitIndex = unitIndex;
            const unitData = vocabularyData[unitIndex];
            
            // 打乱本单元单词并生成挖空位置（仅针对拼写模式使用）
            quizList = [...unitData.words].sort(() => Math.random() - 0.5).map(item => ({
                ...item, 
                gaps: makeGaps(item.en.replace(/ /g, '')) // 处理带空格的单词如"go to bed"
            }));
            
            currentIndex = 0;
            userAnswers = {};
            
            document.getElementById('quiz-title').innerText = `${unitData.unit} 专项练习`;
            
            if(mode === 'fill') initKeyboard();
            showScreen('quiz-screen');
            renderQuestion();
        }

        function makeGaps(wordStr) {
            let indices = [];
            // 根据单词长度决定挖空数量，最小为1，最多不全空
            let gapCount = Math.max(1, Math.floor(wordStr.length * 0.4));
            while(indices.length < gapCount) {
                let r = Math.floor(Math.random() * wordStr.length);
                if(!indices.includes(r)) indices.push(r);
            }
            return indices;
        }

        // --- 渲染单个题目 ---
        function renderQuestion() {
            const item = quizList[currentIndex];
            const display = document.getElementById('quiz-display');
            const spellArea = document.getElementById('spell-area');
            const mcqArea = document.getElementById('mcq-area');
            const kbArea = document.getElementById('keyboard-area');
            
            document.getElementById('quiz-counter').innerText = `${currentIndex + 1} / ${quizList.length}`;
            document.getElementById('progress-fill').style.width = ((currentIndex + 1) / quizList.length * 100) + '%';
            document.getElementById('prev-btn').disabled = currentIndex === 0;

            spellArea.style.display = 'none'; mcqArea.style.display = 'none'; kbArea.style.display = 'none';
            display.style.display = 'block';

            if (currentMode === 'fill') {
                display.style.display = 'none';
                spellArea.style.display = 'flex'; kbArea.style.display = 'grid';
                document.getElementById('quiz-prompt').innerText = `📝 根据中文补全单词：${item.emoji} ${item.cn}`;
                renderSpellBoxes(item);
            } else {
                mcqArea.style.display = 'grid';
                document.getElementById('quiz-prompt').innerText = currentMode === 'en-cn' ? '🎯 请选择正确的翻译：' : '🎯 请选择正确的英文：';
                display.innerText = `${item.emoji} ${currentMode === 'en-cn' ? item.en : item.cn}`;
                renderMCQ(item);
            }
        }

        // 渲染选择题（从本单元词库中抽取干扰项）
        function renderMCQ(item) {
            const mcqArea = document.getElementById('mcq-area');
            mcqArea.innerHTML = '';
            const correct = currentMode === 'en-cn' ? item.cn : item.en;
            const currentUnitWords = vocabularyData[currentUnitIndex].words;

            if (!item.options) {
                let distractors = currentUnitWords.map(d => currentMode === 'en-cn' ? d.cn : d.en)
                    .filter(v => v !== correct).sort(() => Math.random() - 0.5).slice(0, 3);
                // 确保选项有4个，如果本单元词太少则用空补齐（基本都够）
                item.options = [correct, ...distractors].sort(() => Math.random() - 0.5);
            }
            
            item.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                
                // 获取当前选项对应的Emoji来显示在按钮上
                let optEmoji = currentUnitWords.find(w => (currentMode === 'en-cn' ? w.cn : w.en) === opt)?.emoji || '';
                btn.innerHTML = `<span style="margin-right: 8px;">${optEmoji}</span>${opt}`;
                
                if (userAnswers[currentIndex] === opt) btn.classList.add(opt === correct ? 'correct' : 'wrong');
                btn.onclick = () => {
                    userAnswers[currentIndex] = opt;
                    renderQuestion();
                    if(opt === correct) setTimeout(() => changeStep(1), 600);
                };
                mcqArea.appendChild(btn);
            });
        }

        // 渲染拼写框（支持带空格短语如 "wake up"）
        function renderSpellBoxes(item) {
            const spellArea = document.getElementById('spell-area');
            spellArea.innerHTML = '';
            
            if (!userAnswers[currentIndex]) {
                let charIndex = 0;
                userAnswers[currentIndex] = item.en.split('').map(char => {
                    if(char === ' ') return ' ';
                    let isGap = item.gaps.includes(charIndex);
                    charIndex++;
                    return isGap ? '' : char;
                });
            }

            let charIndexTracker = 0;
            userAnswers[currentIndex].forEach((char, i) => {
                if(char === ' ') {
                    const space = document.createElement('div');
                    space.style.width = '20px';
                    spellArea.appendChild(space);
                    return;
                }

                const isGap = item.gaps.includes(charIndexTracker);
                const box = document.createElement('div');
                box.className = 'letter-box' + (isGap ? ' blank' : '');
                box.innerText = char;
                
                if (isGap) {
                    box.onclick = () => {
                        document.querySelectorAll('.letter-box').forEach(b => b.classList.remove('active-blank'));
                        box.classList.add('active-blank');
                        box.dataset.index = i; // 绑定的原始数组索引
                    };
                }
                spellArea.appendChild(box);
                charIndexTracker++;
            });

            // 自动聚焦第一个空框
            const firstBlank = spellArea.querySelector('.blank:empty');
            if (firstBlank) firstBlank.click();
            else {
                const anyBlank = spellArea.querySelector('.blank');
                if(anyBlank) anyBlank.click();
            }
        }

        // 拼写键盘
        function initKeyboard() {
            const kb = document.getElementById('keyboard-area');
            kb.innerHTML = '';
            "abcdefghijklmnopqrstuvwxyz".split('').forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'key-btn'; btn.innerText = key;
                btn.onclick = () => {
                    const active = document.querySelector('.active-blank');
                    if(!active) return;
                    const idx = active.dataset.index;
                    userAnswers[currentIndex][idx] = key;
                    renderSpellBoxes(quizList[currentIndex]);
                    
                    // 检查是否拼满，自动判断跳下一题
                    const currentWordLength = userAnswers[currentIndex].filter(c => c !== ' ').length;
                    const filledLength = userAnswers[currentIndex].filter(c => c && c !== ' ').length;
                    if(currentWordLength === filledLength) {
                        const isCorrect = userAnswers[currentIndex].join('').toLowerCase() === quizList[currentIndex].en.toLowerCase();
                        if(isCorrect) setTimeout(() => changeStep(1), 500);
                    }
                };
                kb.appendChild(btn);
            });
        }

        // 切换题目
        function changeStep(s) {
            currentIndex += s;
            if(currentIndex >= quizList.length) { showResults(); return; }
            if(currentIndex < 0) currentIndex = 0;
            renderQuestion();
        }

        // --- 成绩统计页面 ---
        function showResults() {
            showScreen('result-screen');
            let correct = 0;
            quizList.forEach((item, i) => {
                const ans = userAnswers[i];
                if(currentMode === 'fill') {
                    if(ans && ans.join('').toLowerCase() === item.en.toLowerCase()) correct++;
                } else {
                    const target = currentMode === 'en-cn' ? item.cn : item.en;
                    if(ans === target) correct++;
                }
            });
            const score = Math.round((correct / quizList.length) * 100);
            document.getElementById('final-score').innerText = score + "%";
            document.getElementById('result-summary').innerHTML = `
                <div>所属板块: <strong>${vocabularyData[currentUnitIndex].unit}</strong></div>
                <div>答对题数: <strong>${correct} / ${quizList.length}</strong></div>
            `;
        }

        // --- CSV 下载系统 ---
        function generateCSV(dataArr) {
            let csv = "\uFEFF所属单元,序号,英文,中文/西语\n";
            dataArr.forEach(unitData => {
                unitData.words.forEach((item, i) => {
                    csv += `${unitData.unit},${i+1},${item.en},${item.cn}\n`;
                });
            });
            return csv;
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], {type: 'text/csv;charset=utf-8'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        function downloadAllCSV() {
            const csv = generateCSV(vocabularyData);
            downloadFile(csv, "EMSI_全量单词表.csv");
        }

        function downloadUnitCSV(unitIndex) {
            const csv = generateCSV([vocabularyData[unitIndex]]);
            const safeName = vocabularyData[unitIndex].unit.split(' ')[0]; // 取 Unit1 作为名字前缀
            downloadFile(csv, `EMSI_${safeName}_单词表.csv`);
        }

        // --- 屏幕切换控制 ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 初始化载入所有单词折叠面板
        initUnits();
    </script>
</body>
</html>
