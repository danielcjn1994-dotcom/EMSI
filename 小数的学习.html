<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSI 教学资源 - 小数DECIMALES</title>
<style>
/* 核心布局：锁定高度，消除冗余滚动 */
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', 'PingFang SC', -apple-system, sans-serif;
    background-color: #f5f7fa;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* --- 紧凑页眉设计 --- */
.header {
    background-color: white;
    text-align: center;
    padding: 15px 20px 10px 20px;
    border-bottom: 4px solid #f1c40f;
    position: relative;
    flex-shrink: 0;
}

.back-home {
    position: absolute;
    left: 20px;
    top: 15px;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #1a4a8e;
    font-weight: 600;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #f0f4f8;
    transition: 0.3s;
}

.back-home:hover { background: #e2e8f0; color: #f1c40f; }

.header h1 {
    color: #1a4a8e;
    font-size: clamp(18px, 4vw, 30px);
    font-weight: 800;
    margin: 0;
}

.header .subtitle {
    color: #6b7280;
    font-size: 16px;
    margin-top: 5px;
}

/* --- 内容区：极致屏占比 --- */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    background-color: #d1d5db;
}

/* 沉浸式全屏按钮 */
.fullscreen-btn {
    margin-bottom: 8px;
    padding: 8px 18px;
    background-color: #1a4a8e;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
}

.fullscreen-btn:hover { background-color: #2c5282; transform: scale(1.02); }

.card {
    background: white;
    width: 100%;
    max-width: 1400px;
    flex: 1;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    overflow: hidden;
    position: relative;
}

.pdf-viewer {
    width: 100%;
    height: 100%;
    border: none;
}

/* --- 页脚 --- */
.footer {
    background-color: #1a4a8e;
    color: white;
    text-align: center;
    padding: 8px;
    font-size: 12px;
    flex-shrink: 0;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .header { padding-top: 50px; }
    .back-home { top: 10px; left: 10px; }
    .main-content { padding: 5px; }
}
</style>
</head>
<body>

<header class="header">
    <a href="index.html" class="back-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        返回首页
    </a>
    <h1><span>EMSI</span> 马德里国际中文学校</h1>
    <div class="subtitle">6º de Primaria - 六年级数学练习</div>
</header>

<main class="main-content">
    <button class="fullscreen-btn" onclick="toggleFullScreen()">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1h-4zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zM.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5z"/></svg>
        全屏模式
    </button>

    <div class="card" id="pdfContainer">
        <iframe 
            src="小数.pdf" 
            class="pdf-viewer"
            title="小数学习"
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true">
            您的浏览器不支持预览 PDF，请<a href="小数.pdf">下载文件</a>查看。
        </iframe>
    </div>
</main>

<footer class="footer">
    <span>© 2026 EMSI 马德里国际中文学校 | Educación para un futuro mejor</span>
</footer>

<script>
function toggleFullScreen() {
    const elem = document.getElementById("pdfContainer");
    if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
            elem.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}
</script>

</body>
</html>
